// Compose 编译器的稳定性配置。
//
// 下面这些模块都是纯数据层，不应用 Compose 编译器插件 —— 给 core:model 这类
// 纯模型模块加插件会把整个 Compose runtime 拖进去，代价远大于收益。
// 但不加插件的后果是它们的类型在 :app 里一律被推断为「不稳定」，
// 导致持有它们的 composable 无法被跳过。
//
// 这里显式声明它们稳定。前提是这些类型确实满足稳定契约：
// 全部是 data class，字段为 val，成员类型同样稳定。
// 将来若引入可变字段，这个声明会静默失效并导致 UI 不刷新，届时必须同步撤销。
//
// 刻意不声明 kotlin.collections.List 稳定：我们的列表都来自 Room/Flow，
// 每次发射都是新实例，实例相等已足够兜底；而一旦声明它稳定，
// 哪天有人原地修改列表就会漏掉刷新，那种 bug 极难排查。

com.niceproxy.core.model.*
com.niceproxy.core.service.*
com.niceproxy.core.service.network.*
com.niceproxy.core.network.clash.*
