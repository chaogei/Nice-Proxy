# 注意：这里不要强制 -Dfile.encoding=UTF-8。
# Windows 中文环境下 sun.jnu.encoding 固定为 GBK 且无法通过 -D 覆盖，
# 若把 file.encoding 单独改成 UTF-8，两者不一致会导致 Gradle 测试 worker
# 无法解析含中文字符的 classpath 路径（ClassNotFoundException）。
# 源码编码由各编译任务通过 -encoding 显式指定，不依赖 JVM 默认值。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# gomobile 产出的 AAR 内含预编译 .so，不参与 R8 的原生库处理
android.enableJetifier=false

kotlin.code.style=official

# 本仓库位于 F:\Trace\GitHub源码\Nice-Proxy，路径含中文，AGP 默认直接拒绝构建。
# 这个开关只是关掉那道检查，并不能解决 AAPT2 / R8 / NDK 对非 ASCII 路径的
# 兼容性问题。长期方案仍是把仓库迁到纯 ASCII 路径，见 docs/DESIGN.md §10.1。
android.overridePathCheck=true
